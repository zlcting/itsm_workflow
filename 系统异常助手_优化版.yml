          def initial_state():
              return {'schema': 1, 'mode': 'query', 'problem': '', 'query': '', 'attempted': [], 'followups': 0, 'answered': False, 'last_answer': '', 'draft': {}, 'uploads': {}, 'failed_uploads': [], 'preview': '', 'submission': {}, 'history': [], 'waiting_salary': False, 'metrics': {'query_turns': 0, 'retrieval_calls': 0, 'no_hits': 0, 'query_errors': 0, 'ticket_attempts': 0, 'ticket_successes': 0}}

          def state_load(value):
              s = initial_state()
              s.update(obj(value))
              return s

          def merge_uploads(results, state):
              s = state_load(state)
              failed = 0
              failed_keys = []
              for item in results:
                  item = obj(item)
                  if item.get('key') and item.get('url'):
                      s['uploads'][item['key']] = item['url']
                  else:
                      failed += 1
                      if item.get('key'):
                          failed_keys.append(item['key'])
              s['failed_uploads'] = failed_keys
              s['preview'] = ''
              return {'state': dump(s), 'route': 'FAILED' if failed else 'READY', 'reply': '有 %d 张截图读取或上传失败，其他截图已保留。你可以回复“重试上传”；链接过期时请重新附图并回复“替换失败截图”，也可以回复“不附截图提交”。' % failed if failed else ''}

          def main(results, state):
              return merge_uploads(results=results, state=state)
