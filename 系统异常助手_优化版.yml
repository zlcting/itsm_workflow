app:
  description: 先查询知识库，按证据回答；用户选择后确认建单。
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 系统异常助手 · 优化版
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
