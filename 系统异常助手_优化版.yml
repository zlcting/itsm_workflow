    - id: '1791936000340'
      data:
        title: 校验证据与检索结果
        type: code
        desc: ''
        selected: false
        code_language: python3
        code: |
          import json
          import re
          import hashlib
          import uuid


          def dump(value):
              return json.dumps(value, ensure_ascii=False, separators=(',', ':'))

          def obj(value):
              if isinstance(value, dict):
                  return value
              try:
                  result = json.loads(value or '{}')
                  return result if isinstance(result, dict) else {}
              except (ValueError, TypeError):
                  return {}

          def clean(value, limit=3000):
              return value.strip()[:limit] if isinstance(value, str) else ''

          def initial_state():
              return {'schema': 1, 'mode': 'query', 'problem': '', 'query': '', 'attempted': [], 'followups': 0, 'answered': False, 'last_answer': '', 'draft': {}, 'uploads': {}, 'failed_uploads': [], 'preview': '', 'submission': {}, 'history': [], 'waiting_salary': False, 'metrics': {'query_turns': 0, 'retrieval_calls': 0, 'no_hits': 0, 'query_errors': 0, 'ticket_attempts': 0, 'ticket_successes': 0}}

          def state_load(value):
              s = initial_state()
              s.update(obj(value))
              return s

          def safe_query(query, problem):
              q = re.sub('https?://\\S+', '', clean(query, 600))
              q = re.sub('(?:提交工单|确认提交|帮我建单|附件URL[:：]?|用户意图[:：]?\\w*)', '', q)
              codes = re.findall('\\b[A-Z][A-Z_]*[-:]?\\d{2,}\\b|\\b\\d{3,5}\\b', problem)
              for code in codes:
                  if code not in q:
                      q += ' ' + code
              return re.sub('\\s+', ' ', q).strip()[:800]

          def record_identity(value):
              text = clean(value, 12000)
              text = re.sub('!\\[[^\\]]*\\]\\([^\\n]*?\\)', '', text)
              text = re.sub('\\[([^\\]]+)\\]\\([^)]*\\)', '\\1', text)
              text = re.sub('https?://\\S+', '', text)
              return re.sub('[\\W_]+', '', text, flags=re.UNICODE).casefold()

          def assess(raw, chunks, state, second):
              s = state_load(state)
              d = obj(raw)
              status = d.get('status')
              valid = status in ('ANSWER', 'PARTIAL', 'NONE') and isinstance(d.get('evidence_ids'), list) and all((type(i) is int for i in d['evidence_ids'])) and isinstance(d.get('alternate_query'), str)
              route_name = 'ERROR'
              selected = []
              alternate = ''
              reason = clean(d.get('reason'), 400)
              if valid:
                  ids = sorted(set(d['evidence_ids']))
                  if any((i < 1 or i > len(chunks) for i in ids)):
                      valid = False
                  else:
                      if status == 'NONE':
                          identities = {record_identity(s['problem']), record_identity(s['query'])}
                          identities = {x for x in identities if len(x) >= 8}
                          exact_ids = [i + 1 for i, chunk in enumerate(chunks) if record_identity(chunk.get('content')) in identities]
                          if exact_ids:
                              status, ids = ('PARTIAL', exact_ids)
                              reason = '已召回与当前异常描述一致的记录，但尚无足够依据给出处理办法；请说明资料缺口并展示来源，不得声称没有相关内容。'
                      selected = [chunks[i - 1] for i in ids]
                      if status in ('ANSWER', 'PARTIAL') and selected and any((clean(x.get('content')) for x in selected)):
                          route_name = status
                      elif status == 'NONE' or not chunks:
                          alternate = safe_query(d['alternate_query'], s['problem'])
                          route_name = 'RETRY' if not second and alternate and (alternate != s['query']) else 'NONE'
              if route_name == 'NONE':
                  s['metrics']['no_hits'] += 1
              elif route_name == 'ERROR':
                  s['metrics']['query_errors'] += 1
              identities = {record_identity(s['problem']), record_identity(s['query'])}
              identities = {x for x in identities if len(x) >= 8}
              record_only = route_name == 'PARTIAL' and bool(selected) and all((record_identity(x.get('content')) in identities for x in selected))
              sources = []
              for chunk in selected:
                  metadata = chunk.get('metadata')
                  title = clean((metadata.get('document_name') if isinstance(metadata, dict) else '') or chunk.get('title'), 300)
                  if title and title not in sources:
                      sources.append(title)
              record_reply = ''
              if record_only:
                  source_text = '，来源为' + '、'.join(('《' + title + '》' for title in sources)) if sources else ''
                  record_reply = '找到与“' + clean(s['problem'] or s['query'], 800) + '”相同的问题记录' + source_text + '。但该记录当前可读取的文字只有问题描述，没有原因或处理方法，暂时无法据此提供解决步骤。\n\n' + '你可以补充新的报错文字或操作背景；也可以回复“提交工单”，我会沿用当前问题帮你填写。'
              return {'state': dump(s), 'route': route_name, 'alternate': alternate, 'evidence': selected, 'assessment': dump({'status': route_name, 'reason': reason, 'record_only': record_only, 'sources': sources, 'record_reply': record_reply})}

          def main(raw, chunks, state):
              return assess(raw=raw, chunks=chunks, state=state, second=True)
