        code_language: python3
        code: |
          import json
          import re
          import hashlib
          import uuid


          def dump(value):
              return json.dumps(value, ensure_ascii=False, separators=(',', ':'))

          def obj(value):
              if isinstance(value, dict):
                  return value
              try:
                  result = json.loads(value or '{}')
                  return result if isinstance(result, dict) else {}
              except (ValueError, TypeError):
                  return {}

          def clean(value, limit=3000):
              return value.strip()[:limit] if isinstance(value, str) else ''

          def digest(value):
              return hashlib.sha256(dump(value).encode()).hexdigest()

          def initial_state():
              return {'schema': 1, 'mode': 'query', 'problem': '', 'query': '', 'attempted': [], 'followups': 0, 'answered': False, 'last_answer': '', 'draft': {}, 'uploads': {}, 'failed_uploads': [], 'preview': '', 'submission': {}, 'history': [], 'waiting_salary': False, 'metrics': {'query_turns': 0, 'retrieval_calls': 0, 'no_hits': 0, 'query_errors': 0, 'ticket_attempts': 0, 'ticket_successes': 0}}

          def state_load(value):
              s = initial_state()
              s.update(obj(value))
              return s

          def contract_load(value):
              c = obj(value)
              return c if c.get('version') == 1 else {}

          def file_key(file):
              if isinstance(file, dict):
                  return clean(file.get('key') or file.get('related_id') or file.get('id') or file.get('url') or file.get('remote_url'), 2000) or digest(file)
              return digest(str(file))

          def attachment_gate(state, files, contract):
              s = state_load(state)
              pending = [f for f in files or [] if file_key(f) not in s['uploads']]
              spec = contract_load(contract).get('upload', {})
              ready = isinstance(spec, dict) and spec.get('verified') is True and (spec.get('source') in ('json', 'text')) and all((isinstance(spec.get(key, ''), str) for key in ('body_path', 'url_path', 'success_path'))) and isinstance(spec.get('success_values', []), list)
              if pending and (not ready):
                  return {'route': 'BLOCKED', 'reply': '截图已保留，但附件服务尚未完成接入。你可以稍后重试，或回复“不附截图提交”继续填写工单。'}
              return {'route': 'UPLOAD' if pending else 'READY', 'reply': ''}

          def main(state, files, contract):
              return attachment_gate(state=state, files=files, contract=contract)
