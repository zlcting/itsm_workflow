        code: |
          import json
          import re
          import hashlib
          import uuid


          FACTORIES = {'1001': {'name': '大客户事业体', 'business': 'cbu'}, '1002': {'name': '龙头五金事业体', 'business': 'cbu'}, '1003': {'name': '大健康事业体', 'business': 'cbu'}, '1005': {'name': '智能马桶制造厂', 'business': 'cbu'}, '1004': {'name': '厨卫事业体工厂', 'business': 'cbu'}, '100Z': {'name': '厨卫事业体工厂', 'business': 'cbu'}, '1008': {'name': '大客户事业体', 'business': 'cbu'}, '1009': {'name': '龙头五金事业体', 'business': 'cbu'}, '1007': {'name': '大健康事业体', 'business': 'cbu'}, '1006': {'name': '智能马桶事业部', 'business': 'cbu'}, '100A': {'name': '厦门建霖厨卫事业体工厂', 'business': 'cbu'}, '8031': {'name': '阿匹斯智能电子工厂', 'business': 'apis'}, '8032': {'name': '阿匹斯健康管业工厂', 'business': 'apis'}, '8033': {'name': '阿匹斯智能制造工厂', 'business': 'apis'}, '8038': {'name': '阿匹斯健康管业', 'business': 'apis'}, '8037': {'name': '阿匹斯智能电子', 'business': 'apis'}, '8021': {'name': '英仕8021', 'business': 'easo'}, '8061': {'name': '百霖', 'business': 'fbu'}, '8051': {'name': '漳州大客户事业体8051', 'business': 'zrn'}, '8052': {'name': '龙头五金事业体8052', 'business': 'zrn'}, '8058': {'name': '漳州大客户事业体(无价值)', 'business': 'zrn'}, '8059': {'name': '漳州龙头五金事业体', 'business': 'zrn'}, '8121': {'name': '泰国建霖大客户事业体工厂', 'business': 'thrn'}, '8122': {'name': '泰国建霖龙头五金事业体工厂', 'business': 'thrn'}, '8123': {'name': '泰国建霖大健康客户事业体工厂', 'business': 'thrn'}, '8125': {'name': '泰国建霖厨卫事业体工厂', 'business': 'thrn'}, '8126': {'name': '泰国建霖净水事业体工厂', 'business': 'thrn'}, '8127': {'name': '泰国建霖威霖事业体工厂', 'business': 'thrn'}, '812W': {'name': '泰国建霖无价值工厂', 'business': 'thrn'}, '8011': {'name': '宁波威霖营运中心', 'business': 'wrn'}, '8019': {'name': '宁波威霖', 'business': 'wrn'}, '8191': {'name': '新加坡建霖工厂', 'business': 'sgrn'}, '819W': {'name': '新加坡建霖无价值工厂', 'business': 'sgrn'}}

          SERVICES = ['MES', 'WMS', 'ELM']

          CODES = [0, 6000, 7000, 8001, 8002, 8003, 8004, 8005, 9000, 7001, 7002, 7003, 7004, 6001, 5000, 7005, 5001, 6003]

          def dump(value):
              return json.dumps(value, ensure_ascii=False, separators=(',', ':'))

          def obj(value):
              if isinstance(value, dict):
                  return value
              try:
                  result = json.loads(value or '{}')
                  return result if isinstance(result, dict) else {}
              except (ValueError, TypeError):
                  return {}

          def clean(value, limit=3000):
              return value.strip()[:limit] if isinstance(value, str) else ''

          def normalized(value):
              return re.sub('[\\s。！!？?，,]', '', clean(value)).lower()

          def digest(value):
              return hashlib.sha256(dump(value).encode()).hexdigest()

          def initial_state():
              return {'schema': 1, 'mode': 'query', 'problem': '', 'query': '', 'attempted': [], 'followups': 0, 'answered': False, 'last_answer': '', 'draft': {}, 'uploads': {}, 'failed_uploads': [], 'preview': '', 'submission': {}, 'history': [], 'waiting_salary': False, 'metrics': {'query_turns': 0, 'retrieval_calls': 0, 'no_hits': 0, 'query_errors': 0, 'ticket_attempts': 0, 'ticket_successes': 0}}

          def state_load(value):
              s = initial_state()
              s.update(obj(value))
              return s

          def factory_resolve(value):
              value = clean(value, 200)
              if value.upper() in FACTORIES:
                  return (value.upper(), '')
              candidates = [(code, x['name']) for code, x in FACTORIES.items() if value and (value == x['name'] or value in x['name'])]
              if len(candidates) == 1:
                  return (candidates[0][0], '')
              if candidates:
                  return ('', '该工厂名称对应多个编号，请选择：' + '；'.join((code + '（' + name + '）' for code, name in candidates[:8])))
              return ('', '请提供有效的工厂编号或工厂名称。')

          def login_identity(value):
              """Validate the upstream identifier without guessing employee-number rules."""
              missing = '没有获取到当前登录用户的薪号（工号）。请重新登录业务系统；如仍未恢复，请联系 IT 支持检查身份接入。'
              invalid = '业务系统传入的薪号（工号）格式异常。请重新登录；如仍未恢复，请联系 IT 支持检查身份接入。'
              if value is None:
                  return ('', missing)
              if not isinstance(value, str):
                  return ('', invalid)
              author = value.strip()
              if not author or author.lower() in ('null', 'none', 'undefined'):
                  return ('', missing)
              if len(author) > 128 or re.search('[\\s\\x00-\\x1f\\x7f]', author):
                  return ('', invalid)
              return (author, '')

          def salary_missing(value):
              return value is None or (isinstance(value, str) and value.strip().lower() in ('', 'null', 'none', 'undefined'))

          def resolve_salary(salary_id, manual_salary_id):
              """Use the upstream identity whenever present; manual input is fallback only."""
              if not salary_missing(salary_id):
                  return login_identity(salary_id)
              if salary_missing(manual_salary_id):
                  return ('', '没有获取到薪号（工号），请在薪号输入框中补充后继续。')
              author, error = login_identity(manual_salary_id)
              if error:
                  return ('', '手填薪号（工号）格式异常，请检查输入内容；不要包含空格或换行，长度不超过128个字符。')
              return (author, '')

          def prepare_ticket(state, query, salary_id, contract, manual_salary_id=None):
              s = state_load(state)
              draft = s['draft']
              chat_mode = manual_salary_id is None
              manual = draft.get('_manual_salary_id', '') if chat_mode else manual_salary_id
              if not salary_missing(salary_id):
                  draft.pop('_manual_salary_id', None)
              author, identity_error = resolve_salary(salary_id, manual)
              s['waiting_salary'] = False
              result = {'state': dump(s), 'route': 'REPLY', 'reply': '', 'payload': '{}', 'traceId': '', 'serviceCode': '', 'factoryCode': '', 'code': 0, 'description': '', 'author': '', 'file': '[]'}
              previous = s['submission']
              if previous.get('status') in ('pending', 'unknown'):
                  result['reply'] = '上次提交结果尚待核实，为避免重复建单，暂不再次提交。'
                  if previous.get('feedback'):
                      result['reply'] += '\n\n上次接口返回或调用错误：\n' + literal_feedback(previous['feedback'])
                  result['reply'] += '\n\n请联系 IT 支持核对追踪 ID：' + previous.get('traceId', '')
                  return result
              if previous.get('status') == 'success':
                  result['reply'] = '当前问题已提交成功' + ('，工单号：' + previous['ticket_id'] if previous.get('ticket_id') else '') + '。如有新的异常，请描述新问题。'
                  return result
              factory, factory_error = factory_resolve(draft.get('factory', ''))
              service = clean(draft.get('serviceCode'), 40).upper()
              description = clean(draft.get('description') or s['problem'])
              missing = []
              if not factory:
                  missing.append('工厂：' + (factory_error if draft.get('factory') else '请提供工厂名称或编号。'))
              if service not in SERVICES:
                  context = service or ('SAP' if re.search('\\bSAP\\b', description, re.I) else '')
                  missing.append('工单所属系统：' + ('已记录报错涉及 %s；当前工单接口支持 MES、WMS、ELM，请确认实际归属，不确定可说明。' % context if context else '请选择 MES、WMS 或 ELM。'))
              if not description:
                  missing.append('问题描述：请补充具体报错文字或异常现象。')
              if missing:
                  s['preview'] = ''
                  lead = '已沿用当前问题：' + description[:180] + '\n\n' if description else '可以，我来帮你填写工单。\n\n'
                  if s.get('needs_field_review'):
                      lead += '这次补充尚未识别清楚，已有工单信息已保留。\n'
                  result['reply'] = lead + '还需要补充：\n' + '\n'.join(('- ' + x for x in missing[:2])) + '\n\n可以按“字段名：内容”回复。补齐后我会展示确认清单，确认后再提交；也可以回复“取消工单”。'
              elif s.get('needs_field_review'):
                  s['preview'] = ''
                  result['reply'] = '工单草稿已保留，但上一条补充尚未识别清楚。请按“工厂：名称或编号”“所属系统：MES/WMS/ELM”或“问题描述：内容”重新说明要修改的字段；修改确认前不会提交。'
              elif identity_error:
                  s['preview'] = ''
                  if chat_mode and salary_missing(salary_id):
                      s['waiting_salary'] = True
                      result['reply'] = '工单信息已保留。尚未获取到你的薪号（工号），请输入你的薪号，例如“薪号：001234”。\n\n收到后我会继续填写并展示确认清单，确认后才提交；也可以回复“取消工单”或“继续排查”。'
                  else:
                      result['reply'] = '工单信息已保留，但' + identity_error
              else:
                  try:
                      code = int(draft.get('code', '0'))
                  except (ValueError, TypeError):
                      code = 0
                  code = code if code in CODES else 0
                  trace = clean(draft.get('traceId'), 200)
                  if not trace:
                      trace = uuid.uuid4().hex[:16]
                      draft['traceId'] = trace
                  if any((x.get('traceId') == trace and x.get('status') in ('pending', 'unknown', 'success') for x in s['history'])):
                      result['reply'] = '这个异常数据 ID 已有成功或待核实的提交记录，请先联系 IT 支持核对，暂不重复建单。追踪 ID：' + trace
                      return result
                  if s['attempted']:
                      description += '\n已尝试：\n' + '\n'.join(('- ' + x for x in s['attempted']))
                  if draft.get('ticketType'):
                      description += '\n用户补充的工单类型：' + clean(draft['ticketType'], 100)
                  urls = list(dict.fromkeys(s['uploads'].values()))
                  payload = {'traceId': trace, 'serviceCode': service, 'factoryCode': factory, 'code': code, 'description': description, 'createAuthor': author, 'updateAuthor': author, 'file': dump(urls)}
                  signature = digest(payload)
                  result.update(payload=dump(payload), traceId=trace, serviceCode=service, factoryCode=factory, code=code, description=description, author=author, file=dump(urls))
                  if normalized(query) == '确认提交' and s['preview'] == signature:
                      result['route'] = 'SUBMIT'
                      s['submission'] = {'status': 'pending', 'signature': signature, 'traceId': trace}
                      s['metrics']['ticket_attempts'] += 1
                  else:
                      s['preview'] = signature
                      s['mode'] = 'await_confirm'
                      result['reply'] = '请确认以下工单信息：\n\n- 工厂：%s（%s）\n- 系统：%s\n- 异常数据 ID：%s\n- 异常代码：%s\n- 问题描述：%s\n- 截图：%d 张\n\n信息正确请回复“确认提交”；需要修改请直接说明，也可以回复“取消工单”。' % (FACTORIES[factory]['name'], factory, service, trace, code, description, len(urls))
                      if chat_mode and salary_missing(salary_id):
                          result['reply'] = result['reply'].replace('\n\n信息正确', '\n- 提交人薪号：' + author + '\n\n信息正确')
              result['state'] = dump(s)
              return result

          def literal_feedback(value):
              fence = '`' * max(3, 1 + max([len(x) for x in re.findall('`+', value)] or [0]))
              return fence + 'text\n' + value + '\n' + fence

          def main(state, query, salary_id, contract):
              return prepare_ticket(state=state, query=query, salary_id=salary_id, contract=contract)
