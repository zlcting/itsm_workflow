        code_language: python3
        code: |
          import json
          import re
          import hashlib
          import uuid


          def dump(value):
              return json.dumps(value, ensure_ascii=False, separators=(',', ':'))

          def obj(value):
              if isinstance(value, dict):
                  return value
              try:
                  result = json.loads(value or '{}')
                  return result if isinstance(result, dict) else {}
              except (ValueError, TypeError):
                  return {}

          def contract_load(value):
              c = obj(value)
              return c if c.get('version') == 1 else {}

          def at_path(value, path):
              if not isinstance(path, str):
                  return None
              for part in path.split('.') if path else []:
                  if isinstance(value, list) and part.isdigit() and (int(part) < len(value)):
                      value = value[int(part)]
                  elif isinstance(value, dict) and part in value:
                      value = value[part]
                  else:
                      return None
              return value

          def response_body(text, structured, spec):
              if not isinstance(spec, dict):
                  return None
              source = spec.get('source')
              if source == 'json':
                  value = structured
              elif source == 'text':
                  try:
                      value = json.loads(text)
                  except (ValueError, TypeError):
                      value = text
              else:
                  return None
              return at_path(value, spec.get('body_path', ''))

          def exact_match(value, candidates):
              return any((type(value) is type(x) and value == x for x in candidates))

          def upload_result(text, structured, key, contract):
              spec = contract_load(contract).get('upload', {})
              body = response_body(text, structured, spec)
              url = at_path(body, spec.get('url_path', ''))
              if spec.get('success_path') and (not exact_match(at_path(body, spec['success_path']), spec.get('success_values', []))):
                  url = ''
              if not isinstance(url, str) or not re.fullmatch('https?://[^\\s]+', url):
                  url = ''
              return {'result': dump({'key': key, 'url': url})}

          def main(text, structured, key, contract):
              return upload_result(text=text, structured=structured, key=key, contract=contract)
        variables:
