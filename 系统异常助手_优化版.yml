        code_language: python3
        code: |
          import json
          import re
          import hashlib
          import uuid


          def dump(value):
              return json.dumps(value, ensure_ascii=False, separators=(',', ':'))

          def obj(value):
              if isinstance(value, dict):
                  return value
              try:
                  result = json.loads(value or '{}')
                  return result if isinstance(result, dict) else {}
              except (ValueError, TypeError):
                  return {}

          def clean(value, limit=3000):
              return value.strip()[:limit] if isinstance(value, str) else ''

          def normalized(value):
              return re.sub('[\\s。！!？?，,]', '', clean(value)).lower()

          def digest(value):
              return hashlib.sha256(dump(value).encode()).hexdigest()

          def initial_state():
              return {'schema': 1, 'mode': 'query', 'problem': '', 'query': '', 'attempted': [], 'followups': 0, 'answered': False, 'last_answer': '', 'draft': {}, 'uploads': {}, 'failed_uploads': [], 'preview': '', 'submission': {}, 'history': [], 'waiting_salary': False, 'metrics': {'query_turns': 0, 'retrieval_calls': 0, 'no_hits': 0, 'query_errors': 0, 'ticket_attempts': 0, 'ticket_successes': 0}}

          def state_load(value):
              s = initial_state()
              s.update(obj(value))
              return s

          def file_key(file):
              if isinstance(file, dict):
                  return clean(file.get('key') or file.get('related_id') or file.get('id') or file.get('url') or file.get('remote_url'), 2000) or digest(file)
              return digest(str(file))

          def retain_files(files, pending, state, reset, query):
              kept = [] if reset in ('yes', 'discard') else list(pending or [])
              if normalized(query) == '替换失败截图' and files:
                  failed = state_load(state).get('failed_uploads', [])
                  kept = [x for x in kept if x.get('key') not in failed]
              if reset != 'discard':
                  positions = {x['key']: i for i, x in enumerate(kept)}
                  for file in files or []:
                      item = {'key': file_key(file), 'url': clean(file.get('url') or file.get('remote_url'), 4000), 'filename': clean(file.get('filename'), 200)}
                      if item['key'] in positions:
                          kept[positions[item['key']]] = item
                      else:
                          positions[item['key']] = len(kept)
                          kept.append(item)
              return {'pending': kept}

          def main(files, pending, state, reset, query):
              return retain_files(files=files, pending=pending, state=state, reset=reset, query=query)
        variables:
        - variable: files
          value_selector:
          - sys
          - files
