          role: user
          text: "用户原始消息：\n{{#sys.query#}}\n\n用户输入的附件信息：\n{{#1768980983844.output#}}\n\
            \n意图判断规则：\n- 只有当用户明确表达“提交工单、帮我提交、建单、创建ITSM工单、转人工处理、按建议仍无法解决要提交”等建单/人工处理意图时，用户意图才输出\
