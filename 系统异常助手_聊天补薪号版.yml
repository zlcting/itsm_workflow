app:
  description: '先查询知识库，按证据回答；用户选择后确认建单。

    itsm-dev'
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 系统异常助手
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/xinference:0.0.7@0b689c15d6fe27e5540f68b70fc33fda70a87942481dec849513f69fd5fb0ede
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.2.22@9cea96ffc7977f536c02999c80ff1283b1819aab9b6fa2fdf789d0c6c7d03715
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.67@fb3b4fe807abf06719464cda5d4e845a1d21b865f120bdd4fe6814d6c8a2f6c5
kind: app
version: 0.7.0
workflow:
  conversation_variables:
  - description: 问题、工单草稿、确认签名、提交状态和计数
    id: b17f2891-f3f7-595e-890e-e6d624234a4e
    name: state
    selector:
    - conversation
    - state
    value: '{"schema":1,"mode":"query","problem":"","query":"","attempted":[],"followups":0,"answered":false,"last_answer":"","draft":{},"uploads":{},"failed_uploads":[],"preview":"","submission":{},"history":[],"metrics":{"query_turns":0,"retrieval_calls":0,"no_hits":0,"query_errors":0,"ticket_attempts":0,"ticket_successes":0}}'
    value_type: string
  - description: 当前问题保留的截图，只有建单时上传
    id: 7a9a0a9d-1207-59d9-8354-c732bd3ffb8d
    name: pending_files
    selector:
    - conversation
    - pending_files
    value: []
    value_type: array[object]
  environment_variables:
  - description: ITSM创建成功需status=200且body=true；失败展示原文，未知返回保留待核实；附件上传映射独立配置。
    id: 2927bcd1-5cd9-573a-8b1a-a7eee59ad4d5
    name: itsm_response_contract
    selector:
    - env
    - itsm_response_contract
    value: '{"version":1,"verified":true,"create":{"source":"json","body_path":"0","success_path":"body","success_values":[true],"success_checks":[{"path":"status","values":[200]}],"failure_path":"body","failure_values":[false],"ticket_id_path":""},"upload":{"verified":false,"source":"json","body_path":"0","url_path":"","success_path":"","success_values":[]}}'
    value_type: string
  - description: 仅当图片地址为 /files/... 相对路径时填写 Dify 文件服务的 HTTPS 域名，末尾不带斜杠。
    id: 4d73e796-7e4a-57b1-985e-357684bf4976
    name: dify_files_base_url
    selector:
    - env
    - dify_files_base_url
    value: ''
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - remote_url
      - local_file
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 500
        batch_count_limit: 50
        file_size_limit: 300
        image_file_size_limit: 100
        video_file_size_limit: 1000
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '您好，我是ITSM智能助手，我可以帮您查询异常错误的信息的处理办法，还可以帮您提交异常处理工单

      工单内容包括：

      异常数据ID，

      工厂编号，

      服务代码，

      异常类型，

      工单内容（若工单内容需要添加图片，可以在发送消息的天添加截图信息）'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
