    - data:
        code: "import json\nimport re\nimport hashlib\nimport uuid\n\n\ndef dump(value):\n\
          \    return json.dumps(value, ensure_ascii=False, separators=(',', ':'))\n\
          \ndef obj(value):\n    if isinstance(value, dict):\n        return value\n\
          \    try:\n        result = json.loads(value or '{}')\n        return result\
          \ if isinstance(result, dict) else {}\n    except (ValueError, TypeError):\n\
          \        return {}\n\ndef clean(value, limit=3000):\n    return value.strip()[:limit]\
          \ if isinstance(value, str) else ''\n\ndef normalized(value):\n    return\
          \ re.sub('[\\\\s。！!？?，,]', '', clean(value)).lower()\n\ndef digest(value):\n\
          \    return hashlib.sha256(dump(value).encode()).hexdigest()\n\ndef initial_state():\n\
          \    return {'schema': 1, 'mode': 'query', 'problem': '', 'query': '', 'attempted':\
          \ [], 'followups': 0, 'answered': False, 'last_answer': '', 'draft': {},\
          \ 'uploads': {}, 'failed_uploads': [], 'preview': '', 'submission': {},\
          \ 'history': [], 'metrics': {'query_turns': 0, 'retrieval_calls': 0, 'no_hits':\
          \ 0, 'query_errors': 0, 'ticket_attempts': 0, 'ticket_successes': 0}}\n\n\
          def state_load(value):\n    s = initial_state()\n    s.update(obj(value))\n\
          \    return s\n\ndef file_key(file):\n    if isinstance(file, dict):\n \
          \       return clean(file.get('key') or file.get('related_id') or file.get('id')\
          \ or file.get('url') or file.get('remote_url'), 2000) or digest(file)\n\
          \    return digest(str(file))\n\ndef retain_files(files, pending, state,\
          \ reset, query):\n    kept = [] if reset in ('yes', 'discard') else list(pending\
          \ or [])\n    if normalized(query) == '替换失败截图' and files:\n        failed\
          \ = state_load(state).get('failed_uploads', [])\n        kept = [x for x\
          \ in kept if x.get('key') not in failed]\n    if reset != 'discard':\n \
          \       positions = {x['key']: i for i, x in enumerate(kept)}\n        for\
          \ file in files or []:\n            item = {'key': file_key(file), 'url':\
          \ clean(file.get('url') or file.get('remote_url'), 4000), 'filename': clean(file.get('filename'),\
          \ 200)}\n            if item['key'] in positions:\n                kept[positions[item['key']]]\
          \ = item\n            else:\n                positions[item['key']] = len(kept)\n\
          \                kept.append(item)\n    return {'pending': kept}\n\ndef\
          \ main(files, pending, state, reset, query):\n    return retain_files(files=files,\
          \ pending=pending, state=state, reset=reset, query=query)\n"
