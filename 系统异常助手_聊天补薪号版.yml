    - data:
        code: "import json\nimport re\nimport hashlib\nimport uuid\n\n\ndef dump(value):\n\
          \    return json.dumps(value, ensure_ascii=False, separators=(',', ':'))\n\
          \ndef obj(value):\n    if isinstance(value, dict):\n        return value\n\
          \    try:\n        result = json.loads(value or '{}')\n        return result\
          \ if isinstance(result, dict) else {}\n    except (ValueError, TypeError):\n\
          \        return {}\n\ndef clean(value, limit=3000):\n    return value.strip()[:limit]\
          \ if isinstance(value, str) else ''\n\ndef initial_state():\n    return\
          \ {'schema': 1, 'mode': 'query', 'problem': '', 'query': '', 'attempted':\
          \ [], 'followups': 0, 'answered': False, 'last_answer': '', 'draft': {},\
          \ 'uploads': {}, 'failed_uploads': [], 'preview': '', 'submission': {},\
          \ 'history': [], 'metrics': {'query_turns': 0, 'retrieval_calls': 0, 'no_hits':\
          \ 0, 'query_errors': 0, 'ticket_attempts': 0, 'ticket_successes': 0}}\n\n\
          def state_load(value):\n    s = initial_state()\n    s.update(obj(value))\n\
          \    return s\n\ndef safe_query(query, problem):\n    q = re.sub('https?://\\\
          \\S+', '', clean(query, 600))\n    q = re.sub('(?:提交工单|确认提交|帮我建单|附件URL[:：]?|用户意图[:：]?\\\
          \\w*)', '', q)\n    codes = re.findall('\\\\b[A-Z][A-Z_]*[-:]?\\\\d{2,}\\\
          \\b|\\\\b\\\\d{3,5}\\\\b', problem)\n    for code in codes:\n        if\
          \ code not in q:\n            q += ' ' + code\n    return re.sub('\\\\s+',\
          \ ' ', q).strip()[:800]\n\ndef record_identity(value):\n    text = clean(value,\
          \ 12000)\n    text = re.sub('!\\\\[[^\\\\]]*\\\\]\\\\([^\\\\n]*?\\\\)',\
          \ '', text)\n    text = re.sub('\\\\[([^\\\\]]+)\\\\]\\\\([^)]*\\\\)', '\\\
          \\1', text)\n    text = re.sub('https?://\\\\S+', '', text)\n    return\
          \ re.sub('[\\\\W_]+', '', text, flags=re.UNICODE).casefold()\n\ndef assess(raw,\
          \ chunks, state, second):\n    s = state_load(state)\n    d = obj(raw)\n\
          \    status = d.get('status')\n    valid = status in ('ANSWER', 'PARTIAL',\
          \ 'NONE') and isinstance(d.get('evidence_ids'), list) and all((type(i) is\
          \ int for i in d['evidence_ids'])) and isinstance(d.get('alternate_query'),\
          \ str)\n    route_name = 'ERROR'\n    selected = []\n    alternate = ''\n\
          \    reason = clean(d.get('reason'), 400)\n    if valid:\n        ids =\
          \ sorted(set(d['evidence_ids']))\n        if any((i < 1 or i > len(chunks)\
          \ for i in ids)):\n            valid = False\n        else:\n          \
          \  if status == 'NONE':\n                identities = {record_identity(s['problem']),\
          \ record_identity(s['query'])}\n                identities = {x for x in\
          \ identities if len(x) >= 8}\n                exact_ids = [i + 1 for i,\
          \ chunk in enumerate(chunks) if record_identity(chunk.get('content')) in\
          \ identities]\n                if exact_ids:\n                    status,\
          \ ids = ('PARTIAL', exact_ids)\n                    reason = '已召回与当前异常描述一致的记录，但尚无足够依据给出处理办法；请说明资料缺口并展示来源，不得声称没有相关内容。'\n\
          \            selected = [chunks[i - 1] for i in ids]\n            if status\
          \ in ('ANSWER', 'PARTIAL') and selected and any((clean(x.get('content'))\
          \ for x in selected)):\n                route_name = status\n          \
          \  elif status == 'NONE' or not chunks:\n                alternate = safe_query(d['alternate_query'],\
          \ s['problem'])\n                route_name = 'RETRY' if not second and\
          \ alternate and (alternate != s['query']) else 'NONE'\n    if route_name\
          \ == 'NONE':\n        s['metrics']['no_hits'] += 1\n    elif route_name\
          \ == 'ERROR':\n        s['metrics']['query_errors'] += 1\n    identities\
          \ = {record_identity(s['problem']), record_identity(s['query'])}\n    identities\
          \ = {x for x in identities if len(x) >= 8}\n    record_only = route_name\
          \ == 'PARTIAL' and bool(selected) and all((record_identity(x.get('content'))\
          \ in identities for x in selected))\n    sources = []\n    for chunk in\
          \ selected:\n        metadata = chunk.get('metadata')\n        title = clean((metadata.get('document_name')\
          \ if isinstance(metadata, dict) else '') or chunk.get('title'), 300)\n \
          \       if title and title not in sources:\n            sources.append(title)\n\
          \    record_reply = ''\n    if record_only:\n        source_text = '，来源为'\
          \ + '、'.join(('《' + title + '》' for title in sources)) if sources else ''\n\
          \        record_reply = '找到与“' + clean(s['problem'] or s['query'], 800)\
          \ + '”相同的问题记录' + source_text + '。但该记录当前可读取的文字只有问题描述，没有原因或处理方法，暂时无法据此提供解决步骤。\\\
          n\\n' + '你可以补充新的报错文字或操作背景；也可以回复“提交工单”，我会沿用当前问题帮你填写。'\n    return {'state':\
          \ dump(s), 'route': route_name, 'alternate': alternate, 'evidence': selected,\
          \ 'assessment': dump({'status': route_name, 'reason': reason, 'record_only':\
          \ record_only, 'sources': sources, 'record_reply': record_reply})}\n\ndef\
          \ main(raw, chunks, state):\n    return assess(raw=raw, chunks=chunks, state=state,\
          \ second=False)\n"
