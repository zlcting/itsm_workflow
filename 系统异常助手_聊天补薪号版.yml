          \ = services[0]\n    return result\n\ndef safe_query(query, problem):\n\
          \    q = re.sub('https?://\\\\S+', '', clean(query, 600))\n    q = re.sub('(?:提交工单|确认提交|帮我建单|附件URL[:：]?|用户意图[:：]?\\\
          \\w*)', '', q)\n    codes = re.findall('\\\\b[A-Z][A-Z_]*[-:]?\\\\d{2,}\\\
          \\b|\\\\b\\\\d{3,5}\\\\b', problem)\n    for code in codes:\n        if\
          \ code not in q:\n            q += ' ' + code\n    return re.sub('\\\\s+',\
          \ ' ', q).strip()[:800]\n\ndef chat_salary_value(query, allow_bare):\n \
          \   \"\"\"Read only an explicit field reply or an identifier answering our\
          \ prompt.\"\"\"\n    text = query.strip() if isinstance(query, str) else\
          \ ''\n    labelled = re.fullmatch('(?:我的)?(?:薪号|工号|员工编号)\\\\s*(?:[:：]|是|为|改为|修改为)\\\
