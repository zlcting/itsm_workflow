          \ text) and re.search('\\\\d', text):\n        return (True, text)\n   \
          \ return (False, '')\n\ndef route(raw, state, query, files, salary_id=None):\n\
          \    s = state_load(state)\n    result = {'state': dump(s), 'route': 'REPLY',\
