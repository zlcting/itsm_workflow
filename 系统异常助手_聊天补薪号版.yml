            “有相关记录但无处理办法”必须判为 PARTIAL，不能判为 NONE。相关性与可答性要分开；禁止仅因相同系统名或泛泛词语就判相关。

            NONE：无结果、明显不相关或只有词语重叠；不能仅因缺少处理步骤就判为 NONE。

            例如用户问“模具领用失败，模具台账重复”，资料原文就是该报错加截图链接，应为 PARTIAL，evidence_ids 包含该记录序号，reason
