          \ '新加坡建霖工厂', 'business': 'sgrn'}, '819W': {'name': '新加坡建霖无价值工厂', 'business':\
          \ 'sgrn'}}\n\nSERVICES = ['MES', 'WMS', 'ELM']\n\nINTENTS = ['QUERY', 'FOLLOW_UP',\
          \ 'CREATE_TICKET', 'TICKET_UPDATE', 'CONFIRM', 'CANCEL', 'RESOLVED', 'THANKS',\
          \ 'OTHER']\n\ndef dump(value):\n    return json.dumps(value, ensure_ascii=False,\
          \ separators=(',', ':'))\n\ndef obj(value):\n    if isinstance(value, dict):\n\
          \        return value\n    try:\n        result = json.loads(value or '{}')\n\
          \        return result if isinstance(result, dict) else {}\n    except (ValueError,\
          \ TypeError):\n        return {}\n\ndef clean(value, limit=3000):\n    return\
          \ value.strip()[:limit] if isinstance(value, str) else ''\n\ndef normalized(value):\n\
          \    return re.sub('[\\\\s。！!？?，,]', '', clean(value)).lower()\n\ndef initial_state():\n\
          \    return {'schema': 1, 'mode': 'query', 'problem': '', 'query': '', 'attempted':\
          \ [], 'followups': 0, 'answered': False, 'last_answer': '', 'draft': {},\
