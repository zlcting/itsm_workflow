          \    s.update(obj(value))\n    return s\n\ndef factory_resolve(value):\n\
          \    value = clean(value, 200)\n    if value.upper() in FACTORIES:\n   \
          \     return (value.upper(), '')\n    candidates = [(code, x['name']) for\
