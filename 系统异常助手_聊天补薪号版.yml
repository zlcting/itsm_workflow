            evidence_ids 是支持结论的文档序号（从1开始）；NONE 时填 []。reason 简述依据及仍缺少的信息。

            alternate_query 仅在 NONE 时填写另一种检索表述：保留系统名与错误码，去除无助于检索的流水号；不编造新症状。

            最多允许一次改写检索，第二次仍不足时如实判定。不要为避免 NONE 而夸大证据。

