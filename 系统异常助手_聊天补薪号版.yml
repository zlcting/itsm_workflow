    - data:
        code: "import json\nimport re\nimport hashlib\nimport uuid\n\n\ndef dump(value):\n\
          \    return json.dumps(value, ensure_ascii=False, separators=(',', ':'))\n\
          \ndef obj(value):\n    if isinstance(value, dict):\n        return value\n\
          \    try:\n        result = json.loads(value or '{}')\n        return result\
          \ if isinstance(result, dict) else {}\n    except (ValueError, TypeError):\n\
          \        return {}\n\ndef clean(value, limit=3000):\n    return value.strip()[:limit]\
          \ if isinstance(value, str) else ''\n\ndef initial_state():\n    return\
          \ {'schema': 1, 'mode': 'query', 'problem': '', 'query': '', 'attempted':\
          \ [], 'followups': 0, 'answered': False, 'last_answer': '', 'draft': {},\
          \ 'uploads': {}, 'failed_uploads': [], 'preview': '', 'submission': {},\
          \ 'history': [], 'metrics': {'query_turns': 0, 'retrieval_calls': 0, 'no_hits':\
          \ 0, 'query_errors': 0, 'ticket_attempts': 0, 'ticket_successes': 0}}\n\n\
          def state_load(value):\n    s = initial_state()\n    s.update(obj(value))\n\
          \    return s\n\ndef contract_load(value):\n    c = obj(value)\n    return\
          \ c if c.get('version') == 1 else {}\n\ndef at_path(value, path):\n    if\
          \ not isinstance(path, str):\n        return None\n    for part in path.split('.')\
          \ if path else []:\n        if isinstance(value, list) and part.isdigit()\
          \ and (int(part) < len(value)):\n            value = value[int(part)]\n\
          \        elif isinstance(value, dict) and part in value:\n            value\
          \ = value[part]\n        else:\n            return None\n    return value\n\
          \ndef response_body(text, structured, spec):\n    if not isinstance(spec,\
          \ dict):\n        return None\n    source = spec.get('source')\n    if source\
          \ == 'json':\n        value = structured\n    elif source == 'text':\n \
          \       try:\n            value = json.loads(text)\n        except (ValueError,\
          \ TypeError):\n            value = text\n    else:\n        return None\n\
          \    return at_path(value, spec.get('body_path', ''))\n\ndef exact_match(value,\
          \ candidates):\n    return any((type(value) is type(x) and value == x for\
          \ x in candidates))\n\ndef create_contract_ready(contract):\n    c = contract_load(contract)\n\
          \    spec = c.get('create', {})\n    checks = spec.get('success_checks',\
          \ []) if isinstance(spec, dict) else None\n    return isinstance(spec, dict)\
          \ and c.get('verified') is True and (spec.get('source') in ('text', 'json'))\
          \ and isinstance(spec.get('success_path'), str) and bool(spec['success_path'])\
          \ and all((isinstance(spec.get(key, ''), str) for key in ('body_path', 'failure_path',\
          \ 'ticket_id_path'))) and isinstance(spec.get('success_values'), list) and\
          \ bool(spec['success_values']) and isinstance(spec.get('failure_values',\
          \ []), list) and isinstance(checks, list) and all((isinstance(check, dict)\
          \ and isinstance(check.get('path'), str) and bool(check['path']) and isinstance(check.get('values'),\
          \ list) and bool(check['values']) for check in checks))\n\ndef redact_feedback(value):\n\
          \    secret = '(?:authorization|proxy-authorization|cookie|set-cookie|password|passwd|secret|client_secret|api[_-]?key|access[_-]?token|refresh[_-]?token|token)'\n\
          \    if isinstance(value, dict):\n        return {str(k): '[已隐藏凭据]' if re.fullmatch(secret,\
          \ str(k), re.I) else redact_feedback(v) for k, v in value.items()}\n   \
          \ if isinstance(value, list):\n        return [redact_feedback(v) for v\
          \ in value]\n    if not isinstance(value, str):\n        return value\n\
          \    value = re.sub('(?i)\\\\b(Bearer|Basic)\\\\s+[A-Za-z0-9_./+~=-]+',\
          \ '\\\\1 [已隐藏凭据]', value)\n    value = re.sub('(?i)(\\\\b' + secret + '\\\
          \\b[\\\\\"\\']?\\\\s*[:=]\\\\s*)(\\\\\"[^\\\\\"]*\\\\\"|\\'[^\\']*\\'|[^\\\
          \\s,;&}]+)', '\\\\1[已隐藏凭据]', value)\n    return value\n\ndef feedback_text(value):\n\
          \    if isinstance(value, str):\n        try:\n            value = json.loads(value)\n\
          \        except (ValueError, TypeError):\n            pass\n    value =\
          \ redact_feedback(value)\n    return value.strip() if isinstance(value,\
          \ str) else json.dumps(value, ensure_ascii=False, indent=2)\n\ndef response_feedback(text,\
          \ structured, spec, error_message, error_type):\n    parts = []\n    if\
          \ clean(error_type, 200):\n        parts.append('错误类型：' + clean(error_type,\
          \ 200))\n    if clean(error_message, 12000):\n        parts.append(feedback_text(error_message))\n\
          \    body = response_body(text, structured, spec)\n    if body not in (None,\
          \ '', [], {}):\n        parts.append(feedback_text(body))\n    else:\n \
          \       for value in (structured, text):\n            if value not in (None,\
          \ '', [], {}):\n                candidate = feedback_text(value)\n     \
          \           if candidate not in parts:\n                    parts.append(candidate)\n\
          \    feedback = '\\n'.join(parts)\n    return feedback if len(feedback)\
          \ <= 4000 else feedback[:4000] + '\\n[返回内容较长，后续已截断；完整内容可在本次运行日志查看]'\n\n\
          def literal_feedback(value):\n    fence = '`' * max(3, 1 + max([len(x) for\
          \ x in re.findall('`+', value)] or [0]))\n    return fence + 'text\\n' +\
          \ value + '\\n' + fence\n\ndef submitted(state, text, structured, contract,\
          \ transport_error, error_message='', error_type=''):\n    s = state_load(state)\n\
          \    spec = contract_load(contract).get('create', {})\n    body = response_body(text,\
          \ structured, spec)\n    status = 'unknown'\n    ticket_id = ''\n    if\
          \ not transport_error and create_contract_ready(contract):\n        signal\
          \ = at_path(body, spec['success_path'])\n        failure = at_path(body,\
          \ spec.get('failure_path') or spec['success_path'])\n        if exact_match(failure,\
          \ spec.get('failure_values', [])):\n            status = 'failed'\n    \
          \    elif exact_match(signal, spec['success_values']) and all((exact_match(at_path(body,\
          \ check['path']), check['values']) for check in spec.get('success_checks',\
          \ []))):\n            status = 'success'\n            candidate = at_path(body,\
          \ spec.get('ticket_id_path', '')) if spec.get('ticket_id_path') else None\n\
          \            if type(candidate) in (str, int):\n                ticket_id\
          \ = str(candidate)[:200]\n    feedback = response_feedback(text, structured,\
          \ spec, error_message, error_type)\n    s['submission'].update(status=status,\
          \ ticket_id=ticket_id, feedback=feedback if status != 'success' else '')\n\
          \    s['history'] = (s['history'] + [dict(s['submission'])])[-10:]\n   \
          \ if status == 'success':\n        s['metrics']['ticket_successes'] += 1\n\
          \        s.update(mode='query', preview='', draft={}, uploads={})\n    \
          \    reply = '工单已提交成功' + ('，工单号：' + ticket_id if ticket_id else '') + '。'\n\
          \    elif status == 'failed':\n        s.update(mode='ticket', preview='')\n\
          \        reply = '工单提交失败。接口返回：\\n\\n' + literal_feedback(feedback or '接口返回失败状态，但未提供具体报错信息。')\n\
          \        reply += '\\n\\n草稿和附件已保留。你可以按报错修改信息，或回复“重试提交”重新查看确认清单。'\n    else:\n\
          \        reply = '工单提交时接口调用报错：' if transport_error else '接口已返回，但当前无法确认是否建单成功。接口原始返回：'\n\
          \        reply += '\\n\\n' + literal_feedback(feedback or '未收到可读取的接口返回或具体错误信息。')\n\
          \        reply += '\\n\\n草稿和附件已保留，提交结果尚待核实，不会自动重试。请联系 IT 支持核对追踪 ID：' + s['submission'].get('traceId',\
          \ '')\n    return {'state': dump(s), 'reply': reply, 'status': status}\n\
          \ndef main(state, text, structured, contract):\n    return submitted(state=state,\
          \ text=text, structured=structured, contract=contract, transport_error=False)\n"
