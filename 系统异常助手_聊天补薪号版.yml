          \\s*[:：]?\\\\s*([A-Z0-9]+)[。.!！]?', text)\n    if labelled:\n        value\
          \ = labelled.group(1)\n        return {'factory': value} if value in FACTORIES\
          \ else {}\n    tokens = [x for x in re.split('[\\\\s,，;；、/]+', text.strip('。.!！'))\
          \ if x]\n    if not tokens or len(tokens) > 2 or len(set(tokens)) != len(tokens):\n\
          \        return {}\n    factories = [x for x in tokens if x in FACTORIES]\n\
          \    services = [x for x in tokens if x in SERVICES]\n    if len(factories)\
          \ + len(services) != len(tokens) or len(factories) > 1 or len(services)\
