          \ = {record_identity(s['problem']), record_identity(s['query'])}\n    identities\
          \ = {x for x in identities if len(x) >= 8}\n    record_only = route_name\
          \ == 'PARTIAL' and bool(selected) and all((record_identity(x.get('content'))\
          \ in identities for x in selected))\n    sources = []\n    for chunk in\
          \ selected:\n        metadata = chunk.get('metadata')\n        title = clean((metadata.get('document_name')\
          \ if isinstance(metadata, dict) else '') or chunk.get('title'), 300)\n \
